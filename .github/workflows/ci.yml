name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev_superuser_pw_change_me
          POSTGRES_DB: abidesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Prepare environment configuration
        run: cp .env.example .env

      - name: Initialize PostgreSQL Roles & Extensions
        env:
          PGPASSWORD: dev_superuser_pw_change_me
        run: |
          psql -h localhost -p 5432 -U postgres -d abidesk << 'EOF'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'abidesk_owner') THEN
              CREATE ROLE abidesk_owner LOGIN PASSWORD 'dev_owner_pw_change_me';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'abidesk_app') THEN
              CREATE ROLE abidesk_app LOGIN PASSWORD 'dev_app_pw_change_me';
            END IF;
          END $$;
          ALTER DATABASE abidesk OWNER TO abidesk_owner;
          ALTER SCHEMA public OWNER TO abidesk_owner;
          ALTER ROLE abidesk_owner CREATEDB;
          GRANT CONNECT ON DATABASE abidesk TO abidesk_app;
          GRANT USAGE ON SCHEMA public TO abidesk_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE abidesk_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO abidesk_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE abidesk_owner IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO abidesk_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE abidesk_owner IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO abidesk_app;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          CREATE EXTENSION IF NOT EXISTS "pgcrypto";
          CREATE EXTENSION IF NOT EXISTS "pg_trgm";
          CREATE EXTENSION IF NOT EXISTS "btree_gin";
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @abi-desk/db generate

      - name: Apply Database Migrations (Test DB)
        run: pnpm --filter @abi-desk/db deploy

      - name: Seed Database (Test Data)
        run: pnpm --filter @abi-desk/db seed


      - name: Build Monorepo & Packages
        run: pnpm build

      - name: Run RBAC Matrix Conformance Tests
        run: pnpm --filter @abi-desk/rbac test

      - name: Run Widget Unit Tests
        run: pnpm --filter @abi-desk/widget test

      - name: Run API Unit Tests
        run: pnpm --filter @abi-desk/api test:unit

      - name: Run API Integration Tests (PostgreSQL & Redis)
        run: pnpm --filter @abi-desk/api test:integration

      - name: Typecheck Entire Monorepo
        run: pnpm typecheck

      - name: Verify Docker API Container Build (Dry-Run)
        run: docker build -t abi-desk-api:test -f docker/api/Dockerfile .

